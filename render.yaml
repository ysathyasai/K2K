services:
  # K2K Django REST Intelligence Engine & Agritech Web Service
  - type: web
    name: k2k-intelligence-engine
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn k2k_project.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    plan: free
    region: singapore
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: k2k_project.settings
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: GEMINI_MODEL_NAME
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false # Enter your Gemini API key in the Render Environment Variables tab
